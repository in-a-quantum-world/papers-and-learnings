name: Fetch paper PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/pdf-manifest.csv"
      - "tools/fetch_pdfs.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PDFs from manifest
        run: python3 tools/fetch_pdfs.py

      - name: Commit downloaded PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Add auto-fetched paper PDFs"
            git push
          fi
